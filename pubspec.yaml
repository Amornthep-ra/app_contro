name: pb_controller
description: "A new Flutter project."
publish_to: "none"
version: 2.2.0+22

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.0.2
  shared_preferences: ^2.5.3
  permission_handler: ^11.3.1
  flutter_riverpod: ^3.0.3
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  device_info_plus: ^12.2.0
  package_info_plus: ^8.0.2
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  vibration: ^3.1.6
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_blue_plus_platform_interface: ^9.0.3
  flutter_native_splash: ^2.4.7

  build_runner: ^2.10.4
  freezed: ^3.1.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/BG.png
    - assets/BG_Portrait.png
    - assets/Back.png
    - assets/Settings.png
    - assets/icons/
    - assets/icons/AppBar/
    - assets/icons/settings/
    - assets/icons/HomeUnified/
    - assets/icons/Gamepad_Mode_Edit/
    - assets/Logo/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/static/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto/static/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit/Kanit-Bold.ttf
          weight: 700

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#EDE3F6"
  image: assets/Logo/splash_logo.png

  android_12:
    color: "#EDE3F6"
    image: assets/Logo/splash_android12.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo/App_Icon.png"
  adaptive_icon_foreground: "assets/Logo/App_Icon.png"
  adaptive_icon_background: "#121212"
